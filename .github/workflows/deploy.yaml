name: Build and Deploy to k3s

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'k8s/**'
      - 'src/**'

env:
  DOCKER_REGISTRY: docker.io
  IMAGE_NAME: txsastre/web-gitaction
  K8S_MANIFESTS: k8s/deployment.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # ← Añade timeout explícito
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config
        
    - name: Verify cluster access
      run: kubectl cluster-info

    - name: Deploy to k3s
      run: |
        kubectl apply -f ${{ env.K8S_MANIFESTS }}
        kubectl rollout status deployment/web-gitaction --timeout=90s